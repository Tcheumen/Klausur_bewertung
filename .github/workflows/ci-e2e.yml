name: CI - E2E Angular + Electron (Playwright & Cypress)

on:
  push:
    branches: [ master, develop, ci-test ]
  pull_request:
    branches: [ master, develop ]

# Permissions nécessaires pour GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Évite les déploiements concurrents de Pages
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Dépendances à la racine (Playwright, Cypress, Electron, etc.)
      - name: Install root dependencies
        run: npm ci

      # Dépendances Angular dans le dossier frontend
      - name: Install Angular frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # Build Angular (utilise le script "build" de frontend/package.json)
      - name: Build Angular app
        working-directory: ./frontend
        run: npm run build -- --base-href ./

      # Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Installer Xvfb pour fournir un serveur X virtuel à Electron
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Lancer uniquement les tests Playwright du projet "electron" sous Xvfb
      - name: Run Playwright Electron tests
        run: xvfb-run --auto-servernum -- npx playwright test --project=electron
        env:
          CI: true

      # Uploader le rapport HTML Playwright (si généré)
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  cypress-e2e:
    runs-on: ubuntu-latest
    needs: [playwright-e2e]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install Angular frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # Démarrer le serveur Angular pour Cypress (ng serve)
      - name: Start Angular dev server
        working-directory: ./frontend
        run: npm run start -- --host 0.0.0.0 --port 4200 &

      # Attendre que l'app soit dispo sur http://localhost:4200
      - name: Wait for Angular dev server
        run: npx wait-on http://localhost:4200

      # Installer le binaire Cypress
      - name: Install Cypress binary
        run: npx cypress install

      # Lancer les tests Cypress (script "cypress:run" de package.json)
      - name: Run Cypress tests
        run: npm run cypress:run
        env:
          CI: true

      # Uploader les artefacts Cypress (screenshots, vidéos, résultats)
      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
            cypress/results
          if-no-files-found: ignore

  deploy-playwright-report:
    runs-on: ubuntu-latest
    needs: [playwright-e2e] # on déploie seulement après les tests Playwright
    if: always()           # pour avoir le rapport même en cas d'échec des tests

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Récupérer l'artefact HTML généré par le job playwright-e2e
      - name: Download Playwright report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: ./playwright-report

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Playwright report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./playwright-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
