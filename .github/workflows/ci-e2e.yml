name: CI - E2E Angular + Electron (Playwright & Cypress)

on:
  push:
    branches: [master, main, develop, ci-test]
  pull_request:
    branches: [ main, develop ]

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install Angular frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular app
        working-directory: ./frontend
        run: npm run build -- --base-href ./


      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Electron tests only
        run: npx playwright test --project=electron
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  cypress-e2e:
    runs-on: ubuntu-latest
    needs: [playwright-e2e]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install Angular frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Start Angular dev server
        working-directory: ./frontend
        run: npm run start -- --host 0.0.0.0 --port 4200 &


      - name: Wait for Angular dev server
        run: npx wait-on http://localhost:4200

      - name: Install Cypress binary
        run: npx cypress install

      - name: Run Cypress tests
        run: npm run cypress:run
        env:
          CI: true

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
            cypress/results
          if-no-files-found: ignore
